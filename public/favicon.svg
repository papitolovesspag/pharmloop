<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pharmGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield with dark slate tone -->
  <rect width="64" height="64" rx="16" fill="#0A101D" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#pharmGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- The PharmLoop Mobius / Closed Loop Symbol -->
  <!-- Left node / loop -->
  <path d="M22 24 C14 24 10 29 10 34 C10 39 14 44 22 44 C28 44 32 39 36 34 L42 27 C46 22 50 20 54 24" 
        stroke="url(#pharmGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right node / loop returning -->
  <path d="M42 40 C50 40 54 35 54 30 C54 25 50 20 42 20 C36 20 32 25 28 30 L22 37 C18 42 14 44 10 40" 
        stroke="url(#pharmGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Cold-Chain Biopharma Node (Glowing core) -->
  <circle cx="32" cy="32" r="4.5" fill="#10B981" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
  
  <!-- Subtle satellite data pulses -->
  <circle cx="18" cy="28" r="2" fill="#06B6D4" />
  <circle cx="46" cy="36" r="2" fill="#34D399" />
</svg>
